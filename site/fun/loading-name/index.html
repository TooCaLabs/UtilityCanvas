<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>loading name... | UtilityCanvas</title>
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    .ln-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1rem;
    }
    .ln-screen-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #000;
      aspect-ratio: 16/9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }
    .ln-screen-title {
      font-size: clamp(1rem, 3vw, 1.6rem);
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
      text-align: center;
    }
    .ln-screen-msg {
      font-size: clamp(0.7rem, 1.5vw, 0.95rem);
      color: #aaa;
      margin-bottom: 1.2rem;
      text-align: center;
      min-height: 1.4em;
    }
    .ln-bar-track {
      width: 80%;
      height: 8px;
      background: #222;
      border-radius: 99px;
      overflow: hidden;
    }
    .ln-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      background: #0b85c8;
    }
    .ln-pct {
      font-size: 0.75rem;
      color: #555;
      margin-top: 0.5rem;
    }
    .ln-screen-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.8rem;
      flex-wrap: wrap;
    }
    .ln-options-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(0,29,41,0.78);
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      overflow-y: auto;
      max-height: 72vh;
    }
    .ln-options-card h2 {
      margin: 0;
      font-size: 1.1rem;
      color: var(--ink);
    }
    .ln-section-divider {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-soft);
      border-bottom: 1px solid var(--line);
      padding-bottom: 0.3rem;
      margin-top: 0.3rem;
    }
    .ln-field {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .ln-field label {
      font-size: 0.85rem;
      color: var(--ink-soft);
    }
    .ln-field input, .ln-field select, .ln-field textarea {
      background: rgba(0,17,62,0.75);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      padding: 0.4rem 0.6rem;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
    }
    .ln-field input:focus, .ln-field select:focus, .ln-field textarea:focus {
      border-color: #0b85c8;
    }
    .ln-color-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .ln-color-row input[type=color] {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: none;
      cursor: pointer;
      padding: 2px;
    }
    .ln-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .ln-toggle-row label {
      font-size: 0.85rem;
      color: var(--ink-soft);
    }
    .ln-toggle {
      width: 38px;
      height: 22px;
      background: #333;
      border-radius: 99px;
      border: 1px solid var(--line);
      position: relative;
      cursor: pointer;
      appearance: none;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .ln-toggle:checked { background: #0b85c8; border-color: #0b85c8; }
    .ln-toggle::after {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: #fff;
      top: 2px; left: 2px;
      transition: left 0.2s;
    }
    .ln-toggle:checked::after { left: 18px; }

    .ln-graph-wrap {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .ln-graph-canvas-wrap {
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
      background: #0a0a18;
    }
    .ln-graph-canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      cursor: default;
    }
    .ln-graph-canvas.editable { cursor: crosshair; }
    .ln-graph-hint {
      font-size: 0.72rem;
      color: var(--ink-soft);
      text-align: center;
    }
    .ln-graph-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      color: #555;
    }

    @media (max-width: 700px) {
      .ln-wrap { grid-template-columns: 1fr; }
    }

    /* fullscreen */
    .ln-fullscreen-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .ln-fullscreen-overlay.active { display: flex; }
    .ln-fs-title {
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
      text-align: center;
    }
    .ln-fs-msg {
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      color: #aaa;
      margin-bottom: 2rem;
      text-align: center;
    }
    .ln-fs-bar-track {
      width: 60%;
      height: 12px;
      background: #222;
      border-radius: 99px;
      overflow: hidden;
    }
    .ln-fs-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      background: #0b85c8;
    }
    .ln-fs-pct { font-size: 1rem; color: #555; margin-top: 0.6rem; }
    .ln-fs-exit {
      position: absolute;
      top: 1.5rem; right: 1.5rem;
      background: none;
      border: 1px solid #333;
      color: #555;
      border-radius: 8px;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .ln-fs-exit:hover { color: #fff; border-color: #666; }
  </style>
</head>
<body data-page="fun">
  <div class="bg-shape shape-a" aria-hidden="true"></div>
  <div class="bg-shape shape-b" aria-hidden="true"></div>

  <main class="site-wrap hub-wrap">
    <header class="site-header hub-header">
      <p class="hub-kicker"><a href="/" class="hub-back">← UtilityCanvas</a></p>
      <h1 class="hub-title">loading name...</h1>
      <p class="hub-copy">A fake loading screen. For reasons.</p>
    </header>

    <div class="ln-wrap">

      <!-- Screen preview -->
      <div>
        <div class="ln-screen-card" id="ln-preview">
          <div class="ln-screen-title" id="ln-preview-title">Initializing...</div>
          <div class="ln-screen-msg" id="ln-preview-msg">Please wait</div>
          <div class="ln-bar-track">
            <div class="ln-bar-fill" id="ln-preview-bar"></div>
          </div>
          <div class="ln-pct" id="ln-preview-pct">0%</div>
        </div>
        <div class="ln-screen-actions">
          <button class="primary-btn" id="ln-fullscreen-btn" type="button">⛶ Fullscreen</button>
          <button class="secondary-btn" id="ln-download-btn" type="button">↓ Download</button>
          <button class="secondary-btn" id="ln-restart-btn" type="button">↺ Restart</button>
        </div>
      </div>

      <!-- Options -->
      <div class="ln-options-card">
        <h2>Options</h2>

        <div class="ln-section-divider">General</div>

        <div class="ln-field">
          <label for="ln-title-input">Title</label>
          <input id="ln-title-input" type="text" value="Initializing..." maxlength="60">
        </div>

        <div class="ln-field">
          <label for="ln-speed">Speed</label>
          <select id="ln-speed">
            <option value="slow">Slow</option>
            <option value="normal" selected>Normal</option>
            <option value="fast">Fast</option>

        <div class="ln-field">
          <label>Bar color</label>
          <div class="ln-color-row">
            <input type="color" id="ln-color" value="#0b85c8">

        <div class="ln-toggle-row">

        <div class="ln-toggle-row">
          <label for="ln-random-msgs">Random absurd messages</label>
          <input type="checkbox" class="ln-toggle" id="ln-random-msgs" checked>

        <div class="ln-toggle-row">

        <div class="ln-field">
          <label for="ln-custom-msgs">Custom messages (one per line)</label>
          <textarea id="ln-custom-msgs" rows="3" placeholder="Leave blank to use built-in messages"></textarea>
        </div>

        <div class="ln-section-divider">Easing</div>

        <div class="ln-field">
          <label for="ln-easing-preset">Preset</label>
          <select id="ln-easing-preset">
            <option value="linear">Linear</option>
            <option value="easeInQuad">Ease In</option>
            <option value="easeOutQuad">Ease Out</option>
            <option value="easeInOutQuad" selected>Ease In Out</option>
            <option value="easeInCubic">Ease In Cubic</option>
            <option value="easeOutCubic">Ease Out Cubic</option>
            <option value="easeInOutCubic">Ease In Out Cubic</option>
            <option value="easeOutBounce">Bounce Out</option>
            <option value="easeOutElastic">Elastic Out</option>
            <option value="easeInBack">Back In (overshoot)</option>
            <option value="stepped3">Stepped (3)</option>
            <option value="stepped6">Stepped (6)</option>
            <option value="custom">Custom Bezier</option>
          </select>
        </div>

        <div class="ln-graph-wrap">
          <div class="ln-graph-label-row">
            <span>progress ↑</span>
            <span style="align-self:flex-end">time →</span>
          </div>
          <div class="ln-graph-canvas-wrap">
            <canvas id="ln-graph" class="ln-graph-canvas" width="400" height="400"></canvas>
          </div>
          <p class="ln-graph-hint" id="ln-graph-hint">Select "Custom Bezier" to drag the handles</p>
        </div>

      </div>
    </div>
  </main>

  <!-- Fullscreen overlay -->
  <div class="ln-fullscreen-overlay" id="ln-fs">
    <button class="ln-fs-exit" id="ln-fs-exit">✕ Exit</button>
    <div class="ln-fs-title" id="ln-fs-title">Initializing...</div>
    <div class="ln-fs-msg" id="ln-fs-msg">Please wait</div>
    <div class="ln-fs-bar-track">
      <div class="ln-fs-bar-fill" id="ln-fs-bar"></div>
    </div>
    <div class="ln-fs-pct" id="ln-fs-pct">0%</div>
  </div>

  <script>
  // ── Easing functions ────────────────────────────────────────────────────────
  const EASINGS = {
    linear:         function(t) { return t; },
    easeInQuad:     function(t) { return t * t; },
    easeOutQuad:    function(t) { return t * (2 - t); },
    easeInOutQuad:  function(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; },
    easeInCubic:    function(t) { return t * t * t; },
    easeOutCubic:   function(t) { var s = t - 1; return s*s*s + 1; },
    easeInOutCubic: function(t) { return t < 0.5 ? 4*t*t*t : (t-1)*(2*t-2)*(2*t-2)+1; },
    easeOutBounce:  function(t) {
      if (t < 1/2.75) return 7.5625*t*t;
      if (t < 2/2.75) { t -= 1.5/2.75; return 7.5625*t*t+0.75; }
      if (t < 2.5/2.75) { t -= 2.25/2.75; return 7.5625*t*t+0.9375; }
      t -= 2.625/2.75; return 7.5625*t*t+0.984375;
    },
    easeOutElastic: function(t) {
      if (t === 0 || t === 1) return t;
      return Math.pow(2, -10*t) * Math.sin((t - 0.075) * (2*Math.PI) / 0.3) + 1;
    },
    easeInBack:     function(t) { var c = 1.70158; return t*t*((c+1)*t - c); },
    stepped3:       function(t) { return Math.min(1, Math.floor(t * 3) / 3); },
    stepped6:       function(t) { return Math.min(1, Math.floor(t * 6) / 6); },
  };

  // ── Cubic bezier solver ─────────────────────────────────────────────────────
  function cubicBezier(p1x, p1y, p2x, p2y) {
    return function(t) {
      function B(u, p1, p2) {
        return 3*(1-u)*(1-u)*u*p1 + 3*(1-u)*u*u*p2 + u*u*u;
      }
      var lo = 0, hi = 1, mt = t;
      for (var i = 0; i < 14; i++) {
        var x = B(mt, p1x, p2x) - t;
        if (Math.abs(x) < 0.0001) break;
        if (x > 0) hi = mt; else lo = mt;
        mt = (lo + hi) / 2;
      }
      return B(mt, p1y, p2y);
    };
  }

  var customCP = [0.42, 0, 0.58, 1]; // default = ease in out
  var handles = [{ x: 0.42, y: 0 }, { x: 0.58, y: 1 }];
  var isCustom = false;

  function getEaseFn() {
    var preset = document.getElementById('ln-easing-preset').value;
    if (preset === 'custom') return cubicBezier(customCP[0], customCP[1], customCP[2], customCP[3]);
    return EASINGS[preset] || EASINGS.linear;
  }

  // Approximate bezier control points for each preset (for handle sync)
  var PRESET_CP = {
    linear:         [0, 0, 1, 1],
    easeInQuad:     [0.55, 0, 1, 0.45],
    easeOutQuad:    [0, 0.55, 0.45, 1],
    easeInOutQuad:  [0.42, 0, 0.58, 1],
    easeInCubic:    [0.55, 0.055, 0.675, 0.19],
    easeOutCubic:   [0.215, 0.61, 0.355, 1],
    easeInOutCubic: [0.645, 0.045, 0.355, 1],
    easeOutBounce:  null,
    easeOutElastic: null,
    easeInBack:     null,
    stepped3:       null,
    stepped6:       null,
    custom:         null,
  };

  // ── Graph canvas ────────────────────────────────────────────────────────────
  var gEl = document.getElementById('ln-graph');
  var gCtx = gEl.getContext('2d');
  var GS = 400; // canvas internal size
  var PAD = 36;
  var GW = GS - PAD * 2;
  var GH = GS - PAD * 2;

  function toCv(nx, ny) {
    return [PAD + nx * GW, PAD + (1 - ny) * GH];
  }
  function fromCv(cx, cy) {
    return [(cx - PAD) / GW, 1 - (cy - PAD) / GH];
  }

  function drawGraph() {
    gCtx.clearRect(0, 0, GS, GS);

    // background (canvas doesn't use CSS bg for drawing)
    gCtx.fillStyle = '#0a0a18';
    gCtx.fillRect(0, 0, GS, GS);

    // grid
    gCtx.strokeStyle = 'rgba(255,255,255,0.07)';
    gCtx.lineWidth = 1;
    for (var i = 0; i <= 4; i++) {
      var gx = PAD + (i/4)*GW;
      var gy = PAD + (i/4)*GH;
      gCtx.beginPath(); gCtx.moveTo(gx, PAD); gCtx.lineTo(gx, PAD+GH); gCtx.stroke();
      gCtx.beginPath(); gCtx.moveTo(PAD, gy); gCtx.lineTo(PAD+GW, gy); gCtx.stroke();
    }

    // diagonal hint
    gCtx.strokeStyle = 'rgba(255,255,255,0.06)';
    gCtx.lineWidth = 1;
    gCtx.setLineDash([6,6]);
    gCtx.beginPath();
    var a0 = toCv(0,0), a1 = toCv(1,1);
    gCtx.moveTo(a0[0], a0[1]); gCtx.lineTo(a1[0], a1[1]);
    gCtx.stroke();
    gCtx.setLineDash([]);

    // border
    gCtx.strokeStyle = 'rgba(255,255,255,0.15)';
    gCtx.lineWidth = 1.5;
    gCtx.strokeRect(PAD, PAD, GW, GH);

    var color = document.getElementById('ln-color').value;

    // custom handle lines
    if (isCustom) {
      var p0 = toCv(0, 0), p1 = toCv(handles[0].x, handles[0].y);
      var p2 = toCv(handles[1].x, handles[1].y), p3 = toCv(1, 1);
      gCtx.strokeStyle = 'rgba(255,255,255,0.2)';
      gCtx.lineWidth = 1.5;
      gCtx.setLineDash([4, 4]);
      gCtx.beginPath(); gCtx.moveTo(p0[0], p0[1]); gCtx.lineTo(p1[0], p1[1]); gCtx.stroke();
      gCtx.beginPath(); gCtx.moveTo(p3[0], p3[1]); gCtx.lineTo(p2[0], p2[1]); gCtx.stroke();
      gCtx.setLineDash([]);
    }

    // curve
    var ease = getEaseFn();
    gCtx.strokeStyle = color;
    gCtx.lineWidth = 3;
    gCtx.shadowColor = color;
    gCtx.shadowBlur = 6;
    gCtx.beginPath();
    for (var s = 0; s <= 200; s++) {
      var t = s / 200;
      var v = ease(t);
      v = Math.max(-0.18, Math.min(1.18, v));
      var pt = toCv(t, v);
      s === 0 ? gCtx.moveTo(pt[0], pt[1]) : gCtx.lineTo(pt[0], pt[1]);
    }
    gCtx.stroke();
    gCtx.shadowBlur = 0;

    // anchor dots
    gCtx.fillStyle = 'rgba(255,255,255,0.6)';
    var d0 = toCv(0,0); gCtx.beginPath(); gCtx.arc(d0[0], d0[1], 5, 0, Math.PI*2); gCtx.fill();
    var d1 = toCv(1,1); gCtx.beginPath(); gCtx.arc(d1[0], d1[1], 5, 0, Math.PI*2); gCtx.fill();

    // draggable handles (custom only)
    if (isCustom) {
      handles.forEach(function(h) {
        var pt = toCv(h.x, h.y);
        gCtx.fillStyle = color;
        gCtx.beginPath(); gCtx.arc(pt[0], pt[1], 8, 0, Math.PI*2); gCtx.fill();
        gCtx.strokeStyle = '#fff';
        gCtx.lineWidth = 2;
        gCtx.stroke();
      });
    }
  }

  // Handle drag
  var dragging = null;

  function cvPos(e) {
    var rect = gEl.getBoundingClientRect();
    var scaleX = GS / rect.width;
    var scaleY = GS / rect.height;
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return [(clientX - rect.left) * scaleX, (clientY - rect.top) * scaleY];
  }

  function nearHandle(cx, cy) {
    for (var i = 0; i < handles.length; i++) {
      var pt = toCv(handles[i].x, handles[i].y);
      if (Math.hypot(cx - pt[0], cy - pt[1]) < 14) return i;
    }
    return null;
  }

  gEl.addEventListener('mousedown', function(e) {
    if (!isCustom) return;
    var pos = cvPos(e);
    dragging = nearHandle(pos[0], pos[1]);
  });
  gEl.addEventListener('touchstart', function(e) {
    if (!isCustom) return;
    e.preventDefault();
    var pos = cvPos(e);
    dragging = nearHandle(pos[0], pos[1]);
  }, { passive: false });

  function onDrag(e) {
    if (dragging === null || !isCustom) return;
    var pos = cvPos(e);
    var nxy = fromCv(pos[0], pos[1]);
    var nx = Math.max(0, Math.min(1, nxy[0]));
    var ny = Math.max(-0.18, Math.min(1.18, nxy[1]));
    handles[dragging] = { x: nx, y: ny };
    customCP = [handles[0].x, handles[0].y, handles[1].x, handles[1].y];
    drawGraph();
  }
  gEl.addEventListener('mousemove', onDrag);
  gEl.addEventListener('touchmove', function(e) { e.preventDefault(); onDrag(e); }, { passive: false });
  window.addEventListener('mouseup', function() { dragging = null; });
  window.addEventListener('touchend', function() { dragging = null; });

  document.getElementById('ln-easing-preset').addEventListener('change', function() {
    var preset = document.getElementById('ln-easing-preset').value;
    isCustom = preset === 'custom';
    gEl.className = isCustom ? 'ln-graph-canvas editable' : 'ln-graph-canvas';
    document.getElementById('ln-graph-hint').textContent = isCustom
      ? 'Drag the colored handles to reshape the curve'
      : 'Select "Custom Bezier" to drag the handles';

    var cp = PRESET_CP[preset];
    if (cp) {
      handles = [{ x: cp[0], y: cp[1] }, { x: cp[2], y: cp[3] }];
      customCP = cp.slice();
    }
    drawGraph();
    startLoad();
  });

  // ── Messages ────────────────────────────────────────────────────────────────
  var MESSAGES = [
    "Downloading more RAM…","Deleting System32…","Converting oxygen to CO2…",
    "Reticulating splines…","Negotiating with servers…","Pretending to work…",
    "Calculating the meaning of life…","Warming up the hamsters…",
    "Syncing with the moon…","Bribing the firewall…","Untangling ethernet cables…",
    "Overclocking the toaster…","Installing drivers from 2003…",
    "Generating random numbers… (not that random)","Compressing the internet…",
    "Asking ChatGPT for help…","Googling the error message…",
    "Defragmenting your soul…","Mining cryptocurrency in background…",
    "Teaching AI to feel…","Reversing the polarity…","Rerouting through proxy…",
    "Hacking the mainframe…","Blaming the intern…","Turning it off and on again…",
    "Upgrading to Windows 12…","Downloading the cloud…",
    "Uploading your browsing history…","Charging the flux capacitor…",
  ];
  var ERRORS = [
    "ERROR: Too much swag detected. Continuing anyway…",
    "WARNING: Vibes misaligned. Recalibrating…",
    "CRITICAL: Coffee levels low. Proceeding at reduced capacity…",
    "ERROR 404: Motivation not found. Faking it…",
    "BSOD avoided (barely)…",
    "Kernel panic suppressed. You're welcome…",
  ];

  var speedMap = { slow: 8000, normal: 4000, fast: 1800, ludicrous: 500 };

  var rafId = null;
  var msgQueue = [];
  var msgIdx = 0;

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function getMessages() {
    var custom = document.getElementById('ln-custom-msgs').value.trim();
    if (custom) return custom.split('\n').filter(function(l) { return l.trim(); });
    return document.getElementById('ln-random-msgs').checked ? MESSAGES.slice() : ['Loading…'];
  }

  function setBar(p) {
    var v = Math.max(0, Math.min(100, p));
    document.getElementById('ln-preview-bar').style.width = v + '%';
    document.getElementById('ln-preview-pct').textContent = Math.round(v) + '%';
    document.getElementById('ln-fs-bar').style.width = v + '%';
    document.getElementById('ln-fs-pct').textContent = Math.round(v) + '%';
  }
  function setMsg(m) {
    document.getElementById('ln-preview-msg').textContent = m;
    document.getElementById('ln-fs-msg').textContent = m;
  }
  function setTitle(t) {
    document.getElementById('ln-preview-title').textContent = t;
    document.getElementById('ln-fs-title').textContent = t;
  }
  function setColor(c) {
    document.getElementById('ln-preview-bar').style.background = c;
    document.getElementById('ln-fs-bar').style.background = c;
  }

  function startLoad() {
    if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }

    msgQueue = shuffle(getMessages());
    msgIdx = 0;
    setBar(0);
    setMsg(msgQueue[0] || 'Loading…');
    setTitle(document.getElementById('ln-title-input').value || 'Loading…');
    var barColor = document.getElementById('ln-color').value;
    setColor(barColor);

    var duration = speedMap[document.getElementById('ln-speed').value] || 4000;
    var useErrors = document.getElementById('ln-fake-errors').checked;
    var doLoop   = document.getElementById('ln-loop').checked;
    var easeFn   = getEaseFn();

    var startTime = null;
    var stallStart = 0;
    var stallUntil = 0;
    var stallOffset = 0; // total ms of stalls, subtracted from elapsed

    function frame(now) {
      if (startTime === null) startTime = now;

      // stall in progress
      if (stallUntil > 0) {
        if (now < stallUntil) { rafId = requestAnimationFrame(frame); return; }
        stallOffset += stallUntil - stallStart;
        stallUntil = 0;
        stallStart = 0;
      }

      var elapsed = Math.max(0, now - startTime - stallOffset);
      var rawT = Math.min(1, elapsed / duration);
      var visual = easeFn(rawT);
      setBar(visual * 100);

      // trigger a stall occasionally (~4% chance per second while in mid-range)
      if (useErrors && stallUntil === 0 && rawT > 0.08 && rawT < 0.90 && Math.random() < 0.0006) {
        stallStart = now;
        stallUntil = now + Math.random() * 1000 + 300;
        setMsg(ERRORS[Math.floor(Math.random() * ERRORS.length)]);
      }

      // rotate messages based on rawT
      if (stallUntil === 0) {
        var ni = Math.min(msgQueue.length - 1, Math.floor(rawT * msgQueue.length));
        if (ni !== msgIdx) { msgIdx = ni; setMsg(msgQueue[msgIdx]); }
      }

      if (rawT < 1) {
        rafId = requestAnimationFrame(frame);
      } else {
        setBar(100);
        setMsg('Done.');
        rafId = null;
        if (doLoop) {
          setTimeout(function() { startLoad(); }, 800);
        }
      }
    }
    rafId = requestAnimationFrame(frame);
  }

  // ── Controls ────────────────────────────────────────────────────────────────
  document.getElementById('ln-title-input').addEventListener('input', function() {
    setTitle(this.value || 'Loading…');
  });
  document.getElementById('ln-color').addEventListener('input', function(e) {
    setColor(e.target.value); drawGraph();
  });
  document.getElementById('ln-speed').addEventListener('change', startLoad);
  document.getElementById('ln-random-msgs').addEventListener('change', startLoad);
  document.getElementById('ln-fake-errors').addEventListener('change', startLoad);
  document.getElementById('ln-loop').addEventListener('change', function() {
    if (this.checked) startLoad();
  });
  document.getElementById('ln-restart-btn').addEventListener('click', startLoad);

  document.getElementById('ln-fullscreen-btn').addEventListener('click', function() {
    document.getElementById('ln-fs').classList.add('active');
    startLoad();
  });
  document.getElementById('ln-fs-exit').addEventListener('click', function() {
    document.getElementById('ln-fs').classList.remove('active');
    startLoad();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') document.getElementById('ln-fs-exit').click();
    if (e.key === 'F11') { e.preventDefault(); document.getElementById('ln-fullscreen-btn').click(); }
  });

  document.getElementById('ln-download-btn').addEventListener('click', async function() {
    try {
      const { default: html2canvas } = await import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.esm.js');
      const canvas = await html2canvas(document.getElementById('ln-preview'), { backgroundColor: '#000' });
      const a = document.createElement('a');
      a.download = 'loading-screen.png';
      a.href = canvas.toDataURL();
      a.click();
    } catch(err) {
      alert('Download requires an internet connection for the screenshot library.');
    }
  });

  // ── Init ────────────────────────────────────────────────────────────────────
  drawGraph();
  startLoad();
  </script>
  <script src="/static/site.js"></script>
</body>
</html>
